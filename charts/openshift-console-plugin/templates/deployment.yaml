apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
    app.openshift.io/runtime-namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.plugin.replicas }}
  selector:
    matchLabels:
      {{- include "openshift-console-plugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
            {{- include "openshift-console-plugin.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ template "openshift-console-plugin.name" . }}
          image: {{ required "Plugin image must be specified!" .Values.plugin.image }}
          ports:
            - name: https
              containerPort: {{ .Values.plugin.port }}
              protocol: TCP
          imagePullPolicy: {{ .Values.plugin.imagePullPolicy }}
          env:
            - name: LISTEN_ADDRESS
              value: {{ printf ":%v" .Values.plugin.port | quote }}
            - name: TOPOLOGY_CONFIGMAP_NAME
              value: {{ .Values.plugin.topologyConfigMapName | default "topology" | quote }}
            - name: TOPOLOGY_CONFIGMAP_NAMESPACE
              value: {{ .Values.plugin.topologyConfigMapNamespace | default "kuadrant-system" | quote }}
            - name: METRICS_WORKLOAD_SUFFIX
              value: {{ .Values.plugin.metricsWorkloadSuffix | default "-openshift-default" | quote }}
            - name: TLS_CERTIFICATE_FILE
              value: /var/cert/tls.crt
            - name: TLS_KEY_FILE
              value: /var/cert/tls.key
            - name: MCP_PROXY_ALLOWED_ORIGINS
              value: {{ join "," .Values.plugin.mcpProxy.allowedOrigins | quote }}
            {{- if .Values.plugin.mcpProxy.caConfigMapName }}
            - name: MCP_PROXY_CA_FILE
              value: /var/mcp-ca/ca-bundle.crt
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
          {{- if and (.Values.plugin.securityContext.enabled) (.Values.plugin.containerSecurityContext) }}
          securityContext: {{ tpl (toYaml (omit .Values.plugin.containerSecurityContext "enabled")) $ | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.plugin.resources | nindent 12 }}
          volumeMounts:
            - name: {{ template "openshift-console-plugin.certificateSecret" . }}
              readOnly: true
              mountPath: /var/cert
            {{- if .Values.plugin.mcpProxy.caConfigMapName }}
            - name: mcp-ca
              readOnly: true
              mountPath: /var/mcp-ca
            {{- end }}
      volumes:
        {{- if .Values.plugin.mcpProxy.caConfigMapName }}
        - name: mcp-ca
          configMap:
            name: {{ .Values.plugin.mcpProxy.caConfigMapName | quote }}
        {{- end }}
        - name: {{ template "openshift-console-plugin.certificateSecret" . }}
          secret:
            secretName: {{ template "openshift-console-plugin.certificateSecret" . }}
            defaultMode: 420
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      {{- if and (.Values.plugin.securityContext.enabled) (.Values.plugin.podSecurityContext) }}
      securityContext: {{ tpl (toYaml (omit .Values.plugin.podSecurityContext "enabled")) $ | nindent 8 }}
      {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
