version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # react-i18next is a console federation singleton; the sdk pins its peer to
    # ~16.5.8 and ConsoleRemotePlugin fails the build outside that range. hold
    # until the sdk widens its peer, then drop this entry.
    # @patternfly/react-topology is a console federation singleton; the sdk
    # pins its peer to ~6.4.0 and ConsoleRemotePlugin fails the build outside
    # that range. Remove when the sdk widens its peer to include 6.5+.
    # @openshift-console/dynamic-plugin-sdk-webpack is pinned to the OCP line
    # the plugin targets (4.22). The SDK is patched via yarn patch:. Never bump
    # via Dependabot; update manually when the plugin targets a new OCP release.
    ignore:
      - dependency-name: 'react-i18next'
        versions: ['>=16.6.0']
      - dependency-name: '@patternfly/react-topology'
        versions: ['>=6.5.0']
      - dependency-name: '@openshift-console/dynamic-plugin-sdk-webpack'
      - dependency-name: '@openshift-console/dynamic-plugin-sdk'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'infrastructure'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'infrastructure'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      docker-images:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
