version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # react-i18next is a console federation singleton; the sdk pins its peer to
    # ~16.5.8 and ConsoleRemotePlugin fails the build outside that range. hold
    # until the sdk widens its peer, then drop this entry.
    ignore:
      - dependency-name: 'react-i18next'
        versions: ['>=16.6.0']
      # @patternfly/react-topology is a console federation singleton; SDK 4.22.0
      # peers ~6.4.0 and ConsoleRemotePlugin fails the build at 6.5.0+. OCP 4.22
      # console ships 6.4.x. Remove when an SDK release peers >=6.5.0. See #930.
      - dependency-name: '@patternfly/react-topology'
        versions: ['>=6.5.0']
      # nanoid 4+ is ESM-only; the plugin's CJS toolchain (stylelint via
      # v8-compile-cache) cannot require() ESM modules. nanoid is also pinned in
      # resolutions at 3.3.18. Remove when the toolchain supports ESM. See #924.
      - dependency-name: 'nanoid'
        versions: ['>=4.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'infrastructure'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'infrastructure'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      docker-images:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
