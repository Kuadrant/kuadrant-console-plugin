name: Build and Push

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-?**"
  workflow_dispatch:

env:
  IMG_REGISTRY_HOST: quay.io
  IMG_REGISTRY_ORG: kuadrant
  IMG_REGISTRY_REPO: console-plugin

jobs:
  build:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # ratchet:actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # ratchet:docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
          registry: ${{ env.IMG_REGISTRY_HOST }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # ratchet:docker/metadata-action@v5
        with:
          images: ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.IMG_REGISTRY_REPO }}
          flavor: |
            latest=false
          tags: |
            # Dev: git sha on push to main
            type=raw,value=${{ github.sha }},enable={{is_default_branch}}
            # Dev: latest tag on push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # Release: semver tag (e.g. v0.4.0)
            type=semver,pattern={{raw}}
            # Manual: git sha as fallback
            type=raw,value=${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Read quay image expiry
        id: quay-expiry
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_NAME" == "main" || ( "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ) ]]; then
            echo "expiry=never" >> $GITHUB_OUTPUT
            echo "Setting expiry to 'never' for ref $REF_NAME"
          else
            echo "expiry=3w" >> $GITHUB_OUTPUT
            echo "Setting expiry to '3w' for ref $REF_NAME"
          fi

      - name: Build and Push Image
        if: github.repository_owner == 'kuadrant'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # ratchet:docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            QUAY_IMAGE_EXPIRY=${{ steps.quay-expiry.outputs.expiry }}

      - name: Print Image URL
        run: |
          echo "Image(s) pushed:"
          echo "${{ steps.meta.outputs.tags }}"
