name: Unit Tests

on:
  pull_request:
  push:
    branches: [main, 'release-*']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # only supersede runs for the same pull request
  group: unit-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test
