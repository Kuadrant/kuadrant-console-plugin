name: Unit Tests

on:
  pull_request:
  push:
    branches: [main, 'release-*']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # only supersede runs for the same pull request
  group: unit-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test backend
        run: go test ./cmd/...
