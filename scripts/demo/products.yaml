# The Petstore OpenAPI document is illustrative; the demo backends return talker responses.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: toystore
  namespace: kuadrant-demo-toystore
  labels:
    app.kubernetes.io/part-of: kuadrant-console-demo
  annotations:
    backstage.io/owner: group:default/toystore-team
spec:
  displayName: Toystore API
  description: API-key protected toy catalog with manual access approval and gold, silver, and bronze plans.
  version: v1
  approvalMode: manual
  publishStatus: Published
  tags:
    - demo
    - retail
    - toys
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: toystore
  documentation:
    openAPISpecURL: https://raw.githubusercontent.com/Kuadrant/kuadrantctl/main/examples/oas3/petstore.yaml
    docsURL: https://docs.kuadrant.io/latest/
    gitRepository: https://github.com/Kuadrant/kuadrant-console-plugin
  contact:
    team: toystore-team
    email: toystore@example.com
---
