# Public development-only credentials. The controller creates APIKeyRequests and automatic APIKeyApprovals.
apiVersion: v1
kind: Secret
metadata:
  name: alice-toystore
  namespace: kuadrant-demo-consumer
  labels:
    app.kubernetes.io/part-of: kuadrant-console-demo
type: Opaque
stringData:
  api_key: demo-alice-toystore-key
---
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIKey
metadata:
  name: alice-toystore
  namespace: kuadrant-demo-consumer
  labels:
    app.kubernetes.io/part-of: kuadrant-console-demo
spec:
  apiProductRef:
    name: toystore
    namespace: kuadrant-demo-toystore
  secretRef:
    name: alice-toystore
  planTier: gold
  useCase: Toy catalog integration for a storefront (manual approval).
  requestedBy:
    userId: alice
    email: alice@example.com
