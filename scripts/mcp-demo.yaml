---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-gateway-auth-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: toystore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-demo-gateway-params
  namespace: gateway-system
data:
  service: |
    spec:
      loadBalancerClass: oinc.io/metallb
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: gateway-system
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ''
      kind: ConfigMap
      name: mcp-demo-gateway-params
  listeners:
    - name: mcp
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mcp-demo-gateway
  namespace: gateway-system
spec:
  from:
    - group: mcp.kuadrant.io
      kind: MCPGatewayExtension
      namespace: mcp-gateway-system
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
---
apiVersion: mcp.kuadrant.io/v1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway-extension
  namespace: mcp-gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    namespace: gateway-system
    sectionName: mcp
  publicHost: mcp.127-0-0-1.sslip.io
  privateHost: mcp-gateway-istio.gateway-system.svc.cluster.local:80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway-auth
  namespace: gateway-system
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ''
      kind: ConfigMap
      name: mcp-demo-gateway-params
  listeners:
    - name: mcp
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mcp-demo-gateway-auth
  namespace: gateway-system
spec:
  from:
    - group: mcp.kuadrant.io
      kind: MCPGatewayExtension
      namespace: mcp-gateway-auth-system
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway-auth
---
# Each extension needs its own namespace because broker resource names are fixed.
apiVersion: mcp.kuadrant.io/v1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway-auth-extension
  namespace: mcp-gateway-auth-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway-auth
    namespace: gateway-system
    sectionName: mcp
  publicHost: mcp-auth.127-0-0-1.sslip.io
  privateHost: mcp-gateway-auth-istio.gateway-system.svc.cluster.local:80
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-demo-token
  namespace: kuadrant-system
  labels:
    app: mcp-demo-auth
    authorino.kuadrant.io/managed-by: authorino
stringData:
  api_key: token
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-demo-auth
  namespace: gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway-auth
    sectionName: mcp
  rules:
    authentication:
      bearer-token:
        apiKey:
          selector:
            matchLabels:
              app: mcp-demo-auth
        credentials:
          authorizationHeader:
            prefix: Bearer
    response:
      unauthenticated:
        code: 401
        headers:
          WWW-Authenticate:
            value: Bearer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-demo-auth-authorino
  namespace: kuadrant-system
spec:
  podSelector:
    matchLabels:
      authorino-resource: authorino
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: mcp-gateway-auth
      ports:
        - protocol: TCP
          port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-demo-auth-wasm
  namespace: kuadrant-system
spec:
  podSelector:
    matchLabels:
      app: kuadrant
      control-plane: controller-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: mcp-gateway-auth
      ports:
        - protocol: TCP
          port: 8082
---
# Stateful sample: preserve the existing toystore_* tools and prompt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-test-server
  namespace: toystore
  labels:
    app: mcp-test-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-test-server
  template:
    metadata:
      labels:
        app: mcp-test-server
    spec:
      containers:
        - name: mcp-test-server
          image: ghcr.io/kuadrant/mcp-gateway/test-server1:latest
          imagePullPolicy: IfNotPresent
          command: ['/mcp-test-server']
          args: ['--http', '0.0.0.0:9090']
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: LOG_LEVEL
              value: 'info'
          resources:
            limits:
              memory: '128Mi'
              cpu: '100m'
            requests:
              memory: '64Mi'
              cpu: '50m'
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-test-server
  namespace: toystore
  labels:
    app: mcp-test-server
spec:
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: mcp-test-server
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-test-server-route
  namespace: toystore
  labels:
    mcp-server: 'true'
spec:
  parentRefs:
    - name: mcp-gateway
      namespace: gateway-system
      sectionName: mcp
    - name: mcp-gateway-auth
      namespace: gateway-system
      sectionName: mcp
  hostnames:
    - 'mcp-test-server.mcp.local'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mcp-test-server
          port: 9090
---
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: toystore-mcp-server
  namespace: toystore
  labels:
    mcp.kuadrant.io/managed: 'true'
spec:
  prefix: toystore_
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-test-server-route
---
# Adapted from mcp-gateway/config/test-servers/stateless-server-*.yaml.
# Unlike the upstream local-build fixture, pull the published image if absent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-test-stateless-server
  namespace: toystore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-test-stateless-server
  template:
    metadata:
      labels:
        app: mcp-test-stateless-server
    spec:
      containers:
        - name: mcp-test-stateless-server
          image: ghcr.io/kuadrant/mcp-gateway/test-stateless-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: PORT
              value: '9090'
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-test-stateless-server
  namespace: toystore
spec:
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: mcp-test-stateless-server
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stateless-server-route
  namespace: toystore
spec:
  parentRefs:
    - name: mcp-gateway
      namespace: gateway-system
      sectionName: mcp
    - name: mcp-gateway-auth
      namespace: gateway-system
      sectionName: mcp
  hostnames:
    - stateless-server.mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp-test-stateless-server
          port: 9090
---
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: stateless-mcp-server
  namespace: toystore
  labels:
    mcp.kuadrant.io/managed: 'true'
spec:
  prefix: stateless_
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: stateless-server-route
