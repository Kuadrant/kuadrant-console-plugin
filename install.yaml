apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuadrant-console-plugin
  namespace: kuadrant-system
  labels:
    app: kuadrant-console-plugin
    app.kubernetes.io/component: kuadrant-console-plugin
    app.kubernetes.io/instance: kuadrant-console-plugin
    app.kubernetes.io/name: kuadrant-console-plugin
    app.kubernetes.io/part-of: kuadrant-console-plugin
    app.openshift.io/runtime-namespace: kuadrant-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuadrant-console-plugin
  template:
    metadata:
      labels:
        app: kuadrant-console-plugin
        app.kubernetes.io/component: kuadrant-console-plugin
        app.kubernetes.io/instance: kuadrant-console-plugin
        app.kubernetes.io/name: kuadrant-console-plugin
        app.kubernetes.io/part-of: kuadrant-console-plugin
    spec:
      containers:
        - name: kuadrant-console-plugin
          image: quay.io/kuadrant/console-plugin:latest
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          imagePullPolicy: Always
          env:
            - name: TOPOLOGY_CONFIGMAP_NAME
              value: topology
            - name: TOPOLOGY_CONFIGMAP_NAMESPACE
              value: kuadrant-system
            - name: METRICS_WORKLOAD_SUFFIX
              value: -openshift-default
            - name: TLS_CERTIFICATE_FILE
              value: /var/serving-cert/tls.crt
            - name: TLS_KEY_FILE
              value: /var/serving-cert/tls.key
          volumeMounts:
            - name: plugin-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
      volumes:
        - name: plugin-serving-cert
          secret:
            secretName: plugin-serving-cert
            defaultMode: 420
      restartPolicy: Always
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: plugin-serving-cert
  name: kuadrant-console-plugin
  namespace: kuadrant-system
  labels:
    app: kuadrant-console-plugin
    app.kubernetes.io/component: kuadrant-console-plugin
    app.kubernetes.io/instance: kuadrant-console-plugin
    app.kubernetes.io/name: kuadrant-console-plugin
    app.kubernetes.io/part-of: kuadrant-console-plugin
spec:
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    app: kuadrant-console-plugin
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: kuadrant-console-plugin
spec:
  displayName: 'Kuadrant Console Plugin'
  i18n:
    loadType: Preload
  backend:
    type: Service
    service:
      name: kuadrant-console-plugin
      namespace: kuadrant-system
      port: 9443
      basePath: '/'
  proxy:
    - alias: backend
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: kuadrant-console-plugin
          namespace: kuadrant-system
          port: 9443
